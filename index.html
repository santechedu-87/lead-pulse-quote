<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quotient CRM — Lead & Quotes</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 500: '#10b981', 600: '#059669', 700: '#047857' },
            dark: { 800: '#151c2c', 900: '#0d1322', 950: '#080c16' }
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #090d16; color: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { background-color: #0f172a; border: 1px solid #1e293b; }
    .badge { font-size: 11px; padding: 2px 8px; border-radius: 9999px; font-weight: 600; }
  </style>
</head>
<body class="min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const initialLeads = [
      { id: '1', title: 'Warehouse Robotics Pilot', company: 'Apex Logistics', value: 48000, stage: 'New', owner: 'Ellis', tag: 'Enterprise' },
      { id: '2', title: 'Patient Intake Portal', company: 'Meridian Health', value: 18500, stage: 'Contacted', owner: 'Ellis', tag: 'Healthcare' },
      { id: '3', title: 'Enterprise Cloud Migration', company: 'Northwind Studios', value: 96500, stage: 'Proposal Sent', owner: 'Ellis', tag: 'Enterprise' },
      { id: '4', title: 'Automated QA Rollout', company: 'CyberPeak Corp', value: 32000, stage: 'Won', owner: 'Ellis', tag: 'Fintech' },
      { id: '5', title: 'Legacy Infrastructure Audit', company: 'Beacon Media', value: 7400, stage: 'Lost', owner: 'Ellis', tag: 'Audit' }
    ];

    const initialQuotes = [
      { id: 'Q-2026-001', client: 'Meridian Health', email: 'billing@meridianhealth.org', amount: 18500, status: 'Sent', type: 'Monthly Retainer', date: 'Feb 4, 2026' },
      { id: 'Q-2026-002', client: 'Northwind Studios', email: 'contact@northwind.io', amount: 96500, status: 'Draft', type: 'Fixed Project', date: 'Feb 1, 2026' }
    ];

    function App() {
      const [tab, setTab] = useState('dashboard');
      const [leads, setLeads] = useState(() => JSON.parse(localStorage.getItem('lqm_leads')) || initialLeads);
      const [quotes, setQuotes] = useState(() => JSON.parse(localStorage.getItem('lqm_quotes')) || initialQuotes);
      const [showModal, setShowModal] = useState(false);
      const [selectedQuote, setSelectedQuote] = useState(null);
      const [mobileMenu, setMobileMenu] = useState(false);

      // Quote Form State
      const [clientName, setClientName] = useState('');
      const [clientEmail, setClientEmail] = useState('');
      const [quoteAmount, setQuoteAmount] = useState('');
      const [isRetainer, setIsRetainer] = useState(true);

      useEffect(() => {
        localStorage.setItem('lqm_leads', JSON.stringify(leads));
        localStorage.setItem('lqm_quotes', JSON.stringify(quotes));
      }, [leads, quotes]);

      const totalPipelineValue = leads.reduce((acc, l) => l.stage !== 'Lost' ? acc + Number(l.value) : acc, 0);

      const handleCreateQuote = (e) => {
        e.preventDefault();
        if (!clientName || !quoteAmount) return;
        const newQ = {
          id: `Q-2026-00${quotes.length + 1}`,
          client: clientName,
          email: clientEmail || 'client@domain.com',
          amount: Number(quoteAmount),
          status: 'Draft',
          type: isRetainer ? 'Monthly Retainer' : 'Fixed Project',
          date: 'Just now'
        };
        setQuotes([newQ, ...quotes]);
        setClientName('');
        setClientEmail('');
        setQuoteAmount('');
        setTab('quotes');
      };

      const sendQuote = (q) => {
        setSelectedQuote(q);
        setShowModal(true);
      };

      const confirmSend = () => {
        setQuotes(quotes.map(q => q.id === selectedQuote.id ? { ...q, status: 'Sent' } : q));
        setShowModal(false);
      };

      return (
        <div className="flex flex-col md:flex-row min-h-screen">
          {/* Mobile Navigation Header */}
          <div className="md:hidden flex items-center justify-between px-4 py-3 bg-[#0d1322] border-b border-gray-800 sticky top-0 z-40">
            <div className="flex items-center gap-2.5">
              <div className="w-8 h-8 rounded-lg bg-emerald-500 flex items-center justify-center font-bold text-white text-base">Q</div>
              <div>
                <h1 className="font-bold text-sm text-white leading-none">Quotient</h1>
                <p className="text-[9px] text-gray-400 font-semibold tracking-wider uppercase">Lead & Quotes</p>
              </div>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => { setTab('quotes'); setMobileMenu(false); }} className="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-semibold rounded-lg flex items-center gap-1">
                <i className="fa-solid fa-plus text-[10px]"></i> Quote
              </button>
              <button onClick={() => setMobileMenu(!mobileMenu)} className="p-2 text-gray-400 hover:text-white">
                <i className={`fa-solid ${mobileMenu ? 'fa-xmark' : 'fa-bars'} text-lg`}></i>
              </button>
            </div>
          </div>

          {/* Sidebar */}
          <aside className={`${mobileMenu ? 'flex' : 'hidden'} md:flex md:w-64 bg-[#0d1322] border-r border-gray-800 flex-col justify-between p-4 shrink-0 fixed md:sticky top-0 h-full md:h-screen z-50`}>
            <div>
              <div className="hidden md:flex items-center gap-3 px-2 py-4 mb-6">
                <div className="w-9 h-9 rounded-xl bg-emerald-500 flex items-center justify-center font-extrabold text-white text-lg shadow-lg shadow-emerald-500/20">Q</div>
                <div>
                  <h1 className="font-bold text-base tracking-wide text-white leading-tight">Quotient</h1>
                  <p className="text-[10px] text-gray-400 font-semibold tracking-wider uppercase">Lead & Quotes</p>
                </div>
              </div>

              <nav className="space-y-1.5">
                {[
                  { id: 'dashboard', label: 'Dashboard', icon: 'fa-chart-pie' },
                  { id: 'pipeline', label: 'Leads Pipeline', icon: 'fa-diagram-project' },
                  { id: 'quotes', label: 'Quotation Builder', icon: 'fa-file-invoice-dollar' },
                  { id: 'clients', label: 'Clients', icon: 'fa-users' },
                  { id: 'settings', label: 'Settings', icon: 'fa-gear' }
                ].map(item => (
                  <button
                    key={item.id}
                    onClick={() => { setTab(item.id); setMobileMenu(false); }}
                    className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-xs font-semibold transition ${
                      tab === item.id 
                        ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-500/20' 
                        : 'text-gray-400 hover:text-white hover:bg-gray-800/60'
                    }`}
                  >
                    <i className={`fa-solid ${item.icon} w-4`}></i> {item.label}
                  </button>
                ))}
              </nav>
            </div>

            <div className="pt-4 border-t border-gray-800/80 flex items-center gap-3 px-2">
              <div className="w-8 h-8 rounded-full bg-emerald-600 flex items-center justify-center text-xs font-bold text-white">E</div>
              <div className="truncate text-xs">
                <p className="font-medium text-white truncate">Ellis</p>
                <p className="text-gray-400 text-[10px] truncate">leadpulsequote.com</p>
              </div>
            </div>
          </aside>

          {/* Main Area */}
          <main className="flex-1 p-4 md:p-8 max-w-7xl mx-auto w-full">
            
            {/* Header */}
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-gray-800 mb-6">
              <div>
                <p className="text-[10px] font-bold text-emerald-400 uppercase tracking-wider">Overview</p>
                <h2 className="text-xl md:text-3xl font-extrabold text-white mt-1">
                  {tab === 'dashboard' && 'Good day, Ellis.'}
                  {tab === 'pipeline' && 'Leads Pipeline'}
                  {tab === 'quotes' && 'Quotation Builder'}
                  {tab === 'clients' && 'Client Directory'}
                  {tab === 'settings' && 'Workspace Settings'}
                </h2>
                <p className="text-xs text-gray-400 mt-1">
                  {tab === 'dashboard' && "Here's what's moving in your pipeline today."}
                  {tab === 'pipeline' && 'Filter and advance deals across active sales stages.'}
                  {tab === 'quotes' && 'Create proposals, toggle retainers, and dispatch to client portals.'}
                  {tab === 'clients' && 'Key customer contacts and active revenue summaries.'}
                  {tab === 'settings' && 'Platform parameters and system integrations.'}
                </p>
              </div>
              <button onClick={() => setTab('quotes')} className="hidden sm:flex items-center gap-2 px-4 py-2 bg-emerald-500 hover:bg-emerald-600 text-white text-xs font-bold rounded-lg shadow-lg shadow-emerald-500/20">
                <i className="fa-solid fa-plus"></i> New Quote
              </button>
            </div>

            {/* TAB: DASHBOARD */}
            {tab === 'dashboard' && (
              <div className="space-y-6">
                <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 md:gap-4">
                  <div className="card rounded-xl p-4">
                    <div className="flex justify-between text-[11px] text-gray-400 font-semibold uppercase">
                      <span>Pipeline Value</span>
                      <i className="fa-solid fa-dollar-sign text-emerald-400"></i>
                    </div>
                    <p className="text-xl md:text-2xl font-black text-white mt-2">${totalPipelineValue.toLocaleString()}</p>
                    <p className="text-[10px] text-gray-400 mt-0.5">Across active opportunities</p>
                  </div>
                  <div className="card rounded-xl p-4">
                    <div className="flex justify-between text-[11px] text-gray-400 font-semibold uppercase">
                      <span>Active Quotes</span>
                      <i className="fa-solid fa-file-lines text-blue-400"></i>
                    </div>
                    <p className="text-xl md:text-2xl font-black text-white mt-2">{quotes.length}</p>
                    <p className="text-[10px] text-gray-400 mt-0.5">{quotes.filter(q=>q.status==='Sent').length} sent · {quotes.filter(q=>q.status==='Draft').length} draft</p>
                  </div>
                  <div className="card rounded-xl p-4">
                    <div className="flex justify-between text-[11px] text-gray-400 font-semibold uppercase">
                      <span>Conversion Rate</span>
                      <i className="fa-solid fa-arrow-trend-up text-purple-400"></i>
                    </div>
                    <p className="text-xl md:text-2xl font-black text-white mt-2">50%</p>
                    <p className="text-[10px] text-gray-400 mt-0.5">Won vs. decided leads</p>
                  </div>
                  <div className="card rounded-xl p-4">
                    <div className="flex justify-between text-[11px] text-gray-400 font-semibold uppercase">
                      <span>Clients</span>
                      <i className="fa-solid fa-users text-amber-400"></i>
                    </div>
                    <p className="text-xl md:text-2xl font-black text-white mt-2">3</p>
                    <p className="text-[10px] text-gray-400 mt-0.5">Active in directory</p>
                  </div>
                </div>

                <div className="card rounded-xl p-5">
                  <div className="flex justify-between items-center mb-4">
                    <h3 className="font-bold text-sm text-white">Pipeline Distribution</h3>
                    <button onClick={() => setTab('pipeline')} className="text-xs text-emerald-400 hover:underline">Open pipeline →</button>
                  </div>
                  <div className="space-y-3 text-xs">
                    {['New', 'Contacted', 'Proposal Sent', 'Won', 'Lost'].map(stage => {
                      const stageTotal = leads.filter(l => l.stage === stage).reduce((a, b) => a + Number(b.value), 0);
                      const colors = {
                        'New': 'bg-blue-500 text-blue-400',
                        'Contacted': 'bg-amber-500 text-amber-400',
                        'Proposal Sent': 'bg-purple-500 text-purple-400',
                        'Won': 'bg-emerald-500 text-emerald-400',
                        'Lost': 'bg-red-500 text-red-400'
                      };
                      return (
                        <div key={stage}>
                          <div className="flex justify-between font-medium mb-1">
                            <span className={`${colors[stage].split(' ')[1]} flex items-center gap-2`}>
                              <span className={`w-2 h-2 rounded-full ${colors[stage].split(' ')[0]}`}></span> {stage}
                            </span>
                            <span className="font-bold text-gray-300">${stageTotal.toLocaleString()}</span>
                          </div>
                          <div className="w-full h-1.5 rounded-full bg-gray-800">
                            <div className={`h-full rounded-full ${colors[stage].split(' ')[0]}`} style={{ width: `${Math.min((stageTotal / 100000) * 100, 100)}%` }}></div>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: PIPELINE */}
            {tab === 'pipeline' && (
              <div className="space-y-4">
                <div className="grid grid-cols-1 md:grid-cols-5 gap-3">
                  {['New', 'Contacted', 'Proposal Sent', 'Won', 'Lost'].map(st => (
                    <div key={st} className="card rounded-xl p-3 border-t-2 border-t-emerald-500">
                      <div className="flex justify-between items-center mb-3">
                        <span className="text-[11px] font-bold uppercase tracking-wider text-gray-400">{st}</span>
                        <span className="badge bg-gray-800 text-gray-300">{leads.filter(l => l.stage === st).length}</span>
                      </div>
                      <div className="space-y-2">
                        {leads.filter(l => l.stage === st).map(lead => (
                          <div key={lead.id} className="p-3 bg-gray-800/80 rounded-lg border border-gray-700/60 space-y-1.5">
                            <p className="text-xs font-bold text-white leading-tight">{lead.title}</p>
                            <p className="text-[11px] text-gray-400">{lead.company}</p>
                            <p className="text-xs font-black text-emerald-400">${lead.value.toLocaleString()}</p>
                          </div>
                        ))}
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {/* TAB: QUOTATION BUILDER */}
            {tab === 'quotes' && (
              <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <div className="lg:col-span-2 card rounded-xl p-5 space-y-4">
                  <h3 className="font-bold text-sm text-white">Create Quotation</h3>
                  <form onSubmit={handleCreateQuote} className="space-y-3 text-xs">
                    <div>
                      <label className="text-gray-400 font-medium">Client / Company Name</label>
                      <input required type="text" value={clientName} onChange={e => setClientName(e.target.value)} placeholder="e.g. Acme Corp" className="w-full mt-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="text-gray-400 font-medium">Recipient Email</label>
                      <input type="email" value={clientEmail} onChange={e => setClientEmail(e.target.value)} placeholder="billing@acme.com" className="w-full mt-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white" />
                    </div>
                    <div>
                      <label className="text-gray-400 font-medium">Quote Value ($ USD)</label>
                      <input required type="number" value={quoteAmount} onChange={e => setQuoteAmount(e.target.value)} placeholder="15000" className="w-full mt-1 bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white" />
                    </div>
                    <div className="flex items-center gap-3 p-3 bg-gray-800/50 rounded-lg border border-gray-700">
                      <input type="checkbox" id="ret" checked={isRetainer} onChange={e => setIsRetainer(e.target.checked)} className="w-4 h-4 text-emerald-500 rounded bg-gray-700 border-gray-600" />
                      <label htmlFor="ret" className="text-gray-300 font-medium cursor-pointer">Monthly Recurring Retainer</label>
                    </div>
                    <button type="submit" className="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-lg transition">Save Quotation Draft</button>
                  </form>
                </div>

                <div className="card rounded-xl p-5 space-y-4">
                  <h3 className="font-bold text-sm text-white">Active Quotations</h3>
                  <div className="space-y-2.5 text-xs">
                    {quotes.map(q => (
                      <div key={q.id} className="p-3 bg-gray-800/70 rounded-lg border border-gray-700/60 space-y-2">
                        <div className="flex justify-between items-start">
                          <div>
                            <p className="font-bold text-white">{q.client}</p>
                            <p className="text-[10px] text-gray-400">{q.id} · {q.type}</p>
                          </div>
                          <span className={`badge ${q.status === 'Sent' ? 'bg-blue-500/20 text-blue-400' : 'bg-gray-700 text-gray-300'}`}>{q.status}</span>
                        </div>
                        <div className="flex justify-between items-center pt-2 border-t border-gray-700/50">
                          <span className="font-black text-emerald-400">${q.amount.toLocaleString()}</span>
                          <button onClick={() => sendQuote(q)} className="px-2.5 py-1 bg-gray-700 hover:bg-emerald-500 hover:text-white rounded text-[11px] transition">
                            <i className="fa-solid fa-paper-plane mr-1"></i> Send
                          </button>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              </div>
            )}

            {/* TAB: CLIENTS */}
            {tab === 'clients' && (
              <div className="card rounded-xl p-5">
                <h3 className="font-bold text-sm text-white mb-4">Client Accounts</h3>
                <div className="space-y-3 text-xs">
                  <div className="p-3.5 bg-gray-800/70 rounded-lg flex justify-between items-center border border-gray-700/50">
                    <div><p className="font-bold text-white text-sm">Meridian Health</p><p className="text-gray-400 text-[11px]">billing@meridianhealth.org</p></div>
                    <span className="text-emerald-400 font-bold">$18,500 Retainer</span>
                  </div>
                  <div className="p-3.5 bg-gray-800/70 rounded-lg flex justify-between items-center border border-gray-700/50">
                    <div><p className="font-bold text-white text-sm">Northwind Studios</p><p className="text-gray-400 text-[11px]">contact@northwind.io</p></div>
                    <span className="text-emerald-400 font-bold">$96,500 Deal</span>
                  </div>
                  <div className="p-3.5 bg-gray-800/70 rounded-lg flex justify-between items-center border border-gray-700/50">
                    <div><p className="font-bold text-white text-sm">Apex Logistics</p><p className="text-gray-400 text-[11px]">ops@apexlogistics.com</p></div>
                    <span className="text-gray-300 font-bold">$48,000 Pipeline</span>
                  </div>
                </div>
              </div>
            )}

            {/* TAB: SETTINGS */}
            {tab === 'settings' && (
              <div className="card rounded-xl p-5 max-w-xl space-y-3 text-xs">
                <h3 className="font-bold text-sm text-white mb-3">Settings & Deployment</h3>
                <p><span className="text-gray-400">Custom Domain:</span> leadpulsequote.com</p>
                <p><span className="text-gray-400">Admin Account:</span> Ellis</p>
                <p><span className="text-gray-400">Storage Engine:</span> Browser LocalStorage (Zero-Database setup)</p>
                <button onClick={() => { localStorage.clear(); location.reload(); }} className="mt-4 px-3 py-1.5 bg-red-500/20 text-red-400 border border-red-500/30 rounded font-medium hover:bg-red-500/30 transition">Reset Demo Data</button>
              </div>
            )}
          </main>

          {/* Modal */}
          {showModal && (
            <div className="fixed inset-0 bg-black/75 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="card rounded-2xl max-w-sm w-full p-5 space-y-4">
                <h3 className="font-bold text-sm text-white">Dispatch Quotation</h3>
                <p className="text-xs text-gray-300">Deliver proposal link and retainer contract to <strong className="text-white">{selectedQuote?.email}</strong>?</p>
                <div className="flex justify-end gap-2 pt-2">
                  <button onClick={() => setShowModal(false)} className="px-3 py-1.5 bg-gray-800 text-gray-300 text-xs rounded-lg">Cancel</button>
                  <button onClick={confirmSend} className="px-3 py-1.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold text-xs rounded-lg">Send Quote</button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
